[workspace]
members = [
    "crates/lppw-noise",
    "crates/lppw-world",
    "crates/lppw-render",
    "crates/lppw-net",
]

[workspace.dependencies]
muxapp = { git = "https://github.com/MarcosAndradeV/mux", version = "0.4.0" }
lppw-noise = { path = "crates/lppw-noise" }
lppw-world = { path = "crates/lppw-world" }
lppw-render = { path = "crates/lppw-render" }
lppw-net = { path = "crates/lppw-net" }

[package]
name = "lowpoly-procedural-worlds"
version = "0.1.0"
edition = "2024"
default-run = "lppw"

[dependencies]
muxapp = { workspace = true }
lppw-noise = { workspace = true }
lppw-world = { workspace = true }
lppw-render = { workspace = true }
lppw-net = { workspace = true }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[[bin]]
name = "server"
path = "src/bin/server.rs"

[[bin]]
name = "lppw"
path = "src/bin/lppw.rs"
